<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>EL's Game Center</title>
<style>
:root{
  --sky:#bfe6ff; --sky2:#e8f6ff; --grass:#8fd16a; --grass-d:#5fae45; --tan:#d9b77e; --brown:#8a5a2b;
  --sun:#ffd84a; --ink:#4a3320; --red:#ff7b7b; --green:#6fd36f; --cream:#fff9e6;
  --bar:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{
  font-family:"Comic Sans MS","Comic Neue","Chalkboard SE","Marker Felt",cursive;
  color:var(--ink);
  background:
    radial-gradient(ellipse 60% 30% at 20% 105%, var(--grass-d) 0 60%, transparent 61%),
    radial-gradient(ellipse 70% 32% at 80% 108%, #76c456 0 60%, transparent 61%),
    linear-gradient(var(--sky) 0%, var(--sky2) 55%, var(--grass) 55.1%, var(--grass) 100%);
  position:fixed; inset:0; height:100vh; height:100dvh;
}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.cloud{position:fixed;font-size:8vh;opacity:.85;pointer-events:none;animation:drift 60s linear infinite}
@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}

/* ---------- portrait guard ---------- */
#turn{display:none;position:fixed;inset:0;z-index:9999;background:var(--sky);align-items:center;justify-content:center;flex-direction:column;text-align:center;font-size:7vw}
#turn .big{font-size:22vw;animation:rock 2s ease-in-out infinite}
@keyframes rock{50%{transform:rotate(-20deg)}}
@media (orientation:portrait){ #turn{display:flex} }

/* ---------- screens ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.hidden{display:none!important}

/* ---------- home ---------- */
#home{align-items:center;padding:2vh 3vw}
#home h1{margin:.5vh 0 1.5vh;font-size:clamp(28px,6vh,60px);text-shadow:0 3px 0 #fff8}
#home h1 .h{display:inline-block;animation:hop 1.6s ease-in-out infinite}
#tiles{flex:1;min-height:0;width:100%;max-width:1100px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:2.4vh 2.4vw;padding-bottom:2vh}
.tile{position:relative;background:var(--cream);border-radius:28px;border:5px solid var(--tan);box-shadow:0 8px 0 var(--brown);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6vh;padding:1vh;transition:transform .12s}
.tile:active{transform:translateY(5px);box-shadow:0 3px 0 var(--brown)}
.tile .ic{font-size:clamp(44px,12vh,110px);line-height:1;position:relative}
.tile .ic small{position:absolute;right:-.55em;bottom:-.15em;font-size:.42em}
.tile .nm{font-size:clamp(20px,4vh,38px);font-weight:bold}
.tile .cat{font-size:clamp(13px,2.4vh,22px);opacity:.8}
.tile .lv{font-size:clamp(12px,2.2vh,20px);background:var(--sun);padding:.2em .7em;border-radius:99px}
.tile .gear{position:absolute;top:8px;right:8px;width:52px;height:52px;border-radius:50%;background:#fff;border:3px solid var(--tan);font-size:26px;display:flex;align-items:center;justify-content:center}
.tile.soon{filter:saturate(.45);opacity:.8}
.tile.soon::after{content:"Coming soon";position:absolute;left:50%;top:10px;transform:translateX(-50%) rotate(-3deg);background:var(--sun);border-radius:99px;padding:.15em .8em;font-size:clamp(12px,2.2vh,20px)}

/* ---------- top bar ---------- */
#topbar{height:var(--bar);flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;background:#fff9;backdrop-filter:blur(6px);border-bottom:4px solid var(--tan)}
.rb{width:52px;height:52px;border-radius:16px;background:var(--cream);border:3px solid var(--tan);box-shadow:0 4px 0 var(--brown);font-size:26px;display:flex;align-items:center;justify-content:center;flex:none}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brown)}
#gtitle{font-size:24px;font-weight:bold;white-space:nowrap}
#mascot{font-size:40px;display:inline-block}
#catlabel{font-size:16px;background:var(--cream);border:3px solid var(--tan);border-radius:99px;padding:.15em .8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26vw}
#lvl{margin-left:auto;font-size:20px;background:var(--sun);border-radius:99px;padding:.2em .9em;white-space:nowrap;box-shadow:0 3px 0 #c9a21d}
.hop{animation:hop .6s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px) rotate(-8deg)}70%{transform:translateY(0) rotate(6deg)}}

#stage{flex:1;min-height:0;position:relative}

/* ---------- Word Catch ---------- */
.catch{position:absolute;inset:0;display:flex;align-items:stretch;padding:12px 18px;gap:18px}
.jarwrap{flex:none;width:clamp(80px,11vw,130px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.jar{position:relative;width:100%;flex:1;max-height:66vh;border:5px solid #fff;border-radius:18px 18px 40px 40px;background:#ffffff66;overflow:hidden;box-shadow:inset 0 0 0 3px #9ad}
.jar .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:repeating-linear-gradient(45deg,#ffcf3a 0 14px,#ff9ec4 14px 28px,#8fe0ff 28px 42px);transition:height .5s cubic-bezier(.3,1.6,.5,1)}
.jarwrap .cnt{font-size:20px;background:var(--cream);border-radius:99px;padding:.1em .7em;border:3px solid var(--tan)}
.jarwrap .jl{font-size:34px}
.catch-main{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh}
#repeat{width:clamp(90px,16vh,140px);height:clamp(90px,16vh,140px);border-radius:50%;background:var(--sun);font-size:clamp(40px,8vh,70px);box-shadow:0 7px 0 #c9a21d;display:flex;align-items:center;justify-content:center}
#repeat:active{transform:translateY(5px);box-shadow:0 2px 0 #c9a21d}
#cards{display:flex;gap:2.2vw;justify-content:center;align-items:center;width:100%}
.wcard{flex:1;max-width:30%;height:clamp(130px,30vh,260px);background:var(--cream);border:6px solid var(--tan);border-radius:30px;box-shadow:0 9px 0 var(--brown);
  display:flex;align-items:center;justify-content:center;text-align:center;font-weight:bold;padding:6px;overflow:hidden;
  animation:flyup .8s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*.13s)}
@keyframes flyup{from{transform:translateY(90vh) rotate(calc((var(--i) - 1)*14deg));opacity:0}to{transform:none;opacity:1}}
.wcard.wrong{animation:shake .45s both;background:#e3e3e3;border-color:#bbb;color:#999;box-shadow:0 3px 0 #aaa;pointer-events:none}
.wcard.win{animation:pulse .6s both;background:#e5ffd9;border-color:var(--green)}
.wcard.gone{opacity:0;transform:scale(.6);transition:all .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-14px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(6px)}}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1.08)}}

.pinata{position:absolute;inset:0;z-index:30;background:#0006;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.pinata .rope{width:6px;height:12vh;background:var(--brown)}
.pinata .pn{font-size:30vh;line-height:1;transform-origin:50% 0;animation:swing 1.6s ease-in-out infinite;background:none}
.pinata .pn.hit{animation:pnhit .3s}
@keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes pnhit{0%{transform:rotate(0) scale(1)}30%{transform:rotate(-25deg) scale(1.15)}70%{transform:rotate(18deg) scale(.95)}100%{transform:rotate(0) scale(1)}}
.pinata .hint{font-size:4.5vh;color:#fff;text-shadow:0 2px 0 #0008;margin-top:1vh}
.pinata .pips{font-size:5vh;letter-spacing:.2em}

/* ---------- Match ---------- */
.match{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 20% minmax(0,1fr);padding:14px 22px}
.col{display:grid;grid-template-rows:repeat(4,1fr);gap:14px;min-height:0}
.mcard{background:var(--cream);border:6px solid var(--tan);border-radius:24px;box-shadow:0 7px 0 var(--brown);display:flex;align-items:center;justify-content:center;font-weight:bold;min-height:0;overflow:hidden;padding:4px;transition:transform .12s;
  animation:popin .5s both;animation-delay:calc(var(--i)*.08s)}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
.mcard.word{font-size:clamp(26px,5.2vh,56px)}
.mcard.pic{font-size:clamp(40px,10.5vh,100px);line-height:1}
.mcard.sel{border-color:#4aa3ff;background:#e3f2ff;transform:scale(1.05)}
.mcard.bad{animation:shake .45s both;border-color:var(--red);background:#ffe0e0}
.mcard.ok{border-color:var(--green);background:#e5ffd9;pointer-events:none;box-shadow:0 3px 0 #4aa04a;transform:translateY(3px)}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#lines line{stroke-width:9;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}

/* ---------- overlays / fx ---------- */
.banner{position:fixed;left:50%;top:38%;z-index:500;transform:translate(-50%,-50%);font-size:clamp(36px,10vh,90px);font-weight:bold;background:var(--sun);border:6px solid #fff;border-radius:40px;padding:.2em .8em;box-shadow:0 10px 0 #c9a21d;white-space:nowrap;animation:ban 1.9s both;pointer-events:none}
@keyframes ban{0%{transform:translate(-50%,-50%) scale(.2) rotate(-10deg);opacity:0}15%{transform:translate(-50%,-50%) scale(1.15) rotate(3deg);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{transform:translate(-50%,-150%) scale(1);opacity:0}}
.conf{position:fixed;z-index:400;pointer-events:none;font-size:28px;animation:conf 1.1s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--rot));opacity:0}}

#modal{position:fixed;inset:0;z-index:700;background:#0007;display:flex;align-items:center;justify-content:center}
#modal .box{background:var(--cream);border:6px solid var(--tan);border-radius:30px;padding:28px 34px;width:min(560px,90vw);display:flex;flex-direction:column;gap:18px;align-items:stretch;text-align:center}
#modal h2{margin:0;font-size:28px}
#modal select{font:inherit;font-size:26px;padding:14px;border-radius:16px;border:4px solid var(--tan);background:#fff}
#modal .done{font-size:28px;padding:12px;border-radius:20px;background:var(--green);box-shadow:0 6px 0 #3f9d3f;font-weight:bold}
#modal small{opacity:.7}

/* ---------- shared pieces for games 3-6 ---------- */
.rowbtn{width:clamp(80px,14vh,120px);height:clamp(80px,14vh,120px);border-radius:50%;background:var(--sun);font-size:clamp(36px,7vh,60px);box-shadow:0 7px 0 #c9a21d;display:flex;align-items:center;justify-content:center;flex:none}
.rowbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #c9a21d}
.chip{font-size:16px;background:var(--cream);border:3px solid var(--tan);border-radius:99px;padding:.3em .9em;box-shadow:0 3px 0 var(--brown)}
.intro{position:absolute;inset:0;z-index:40;background:#0006;display:flex;align-items:center;justify-content:center}
.intro .box{background:var(--cream);border:6px solid var(--tan);border-radius:30px;padding:28px 36px;width:min(620px,88vw);text-align:center;display:flex;flex-direction:column;gap:16px}
.intro h2{margin:0;font-size:32px}.intro p{margin:0;font-size:22px}
.intro .go{font-size:30px;padding:12px;border-radius:20px;background:var(--green);box-shadow:0 6px 0 #3f9d3f;font-weight:bold}

/* Horse Race */
.race{position:absolute;inset:0;display:flex;flex-direction:column;padding:12px 22px;gap:2vh}
.track{position:relative;height:27vh;flex:none;border-radius:24px;border:5px solid var(--brown);overflow:hidden;
  background:repeating-linear-gradient(90deg,#fff3 0 4px,transparent 4px 12.5%),linear-gradient(#c9a064 0 100%);box-shadow:0 6px 0 var(--brown)}
.track::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:5px dashed #fff8}
.track .finish{position:absolute;right:1.5vh;bottom:6%;font-size:11vh;line-height:1}
.track .runner{position:absolute;bottom:6%;left:calc(var(--p,0)*(100% - 28vh) + 1vh);font-size:12vh;line-height:1;transition:left .9s ease-in-out}
.track .runner span{display:inline-block;transform:scaleX(-1)}
.track .runner.go span{animation:gallop .3s ease-in-out 3}
@keyframes gallop{50%{transform:scaleX(-1) translateY(-2.5vh) rotate(6deg)}}
.race-row{flex:1;min-height:0;display:flex;align-items:center;gap:2vw}
.race .wcard{height:clamp(110px,26vh,220px)}

/* Word Bingo */
.bingo{position:absolute;inset:0;display:flex;padding:12px 22px;gap:20px}
.bside{flex:none;width:clamp(100px,14vw,150px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
.bcount{font-size:20px;background:var(--cream);border:3px solid var(--tan);border-radius:99px;padding:.1em .8em}
.bgrid{flex:1;min-width:0;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:14px}
.bcell{position:relative;background:var(--cream);border:6px solid var(--tan);border-radius:24px;box-shadow:0 7px 0 var(--brown);font-weight:bold;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px;min-height:0;animation:popin .5s both;animation-delay:calc(var(--i)*.05s)}
.bcell.bad{animation:shake .45s both;border-color:var(--red)}
.bcell.mark{background:#fff3b0;border-color:var(--sun);pointer-events:none}
.bcell.mark::after{content:"⭐";position:absolute;font-size:12vh;animation:starpop .5s both;filter:drop-shadow(0 3px 0 #0003)}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}

.bcell.again{background:#e5ffd9;border-color:var(--green)}
.hole .wc.soft{background:#e5ffd9;border-color:var(--green)}
/* Whack-a-Word */
.whack{position:absolute;inset:0;display:flex;padding:12px 22px;gap:20px}
.holes{flex:1;min-width:0;display:grid;grid-template:repeat(2,1fr)/repeat(3,1fr);gap:16px}
.hole{position:relative;overflow:hidden;border-radius:20px}
.hole .mound{position:absolute;left:4%;right:4%;bottom:0;height:34%;background:radial-gradient(ellipse at 50% 20%,#a0702f,#6b4420);border-radius:50% 50% 14px 14px/70% 70% 14px 14px;z-index:2}
.hole .wc{position:absolute;left:8%;right:8%;bottom:20%;height:62%;background:var(--cream);border:6px solid var(--tan);border-radius:22px;box-shadow:0 5px 0 var(--brown);display:flex;align-items:center;justify-content:center;font-weight:bold;transform:translateY(130%);transition:transform .22s cubic-bezier(.3,1.5,.5,1);z-index:1}
.hole .wc.up{transform:none}
.hole .wc.win{background:#e5ffd9;border-color:var(--green)}
.hole .wc.win::after{content:"⭐";position:absolute;top:-4px;right:-2px;font-size:7vh;animation:starpop .4s both}
.hole .wc.boing{animation:shake .35s}

/* Feed the Horse */
.feed{position:absolute;inset:0;display:flex;padding:12px 22px;gap:20px}
.pasture{flex:1;min-width:0;display:grid;grid-template:repeat(2,1fr)/repeat(3,1fr);gap:10px}
.pasture .slot{display:flex;align-items:center;justify-content:center}
.fcard{width:92%;height:78%;background:var(--cream);border:6px solid var(--tan);border-radius:24px;box-shadow:0 7px 0 var(--brown);font-weight:bold;display:flex;align-items:center;justify-content:center;padding:4px;overflow:hidden;
  transform:translate(var(--tx),var(--ty)) rotate(var(--r));transition:transform .15s;animation:popin .5s both;animation-delay:calc(var(--i)*.07s)}
.fcard.sel{border-color:#4aa3ff;background:#e3f2ff;transform:translate(var(--tx),var(--ty)) rotate(0) scale(1.1)}
.fcard.bounce{animation:hop .5s}
.stable{flex:none;width:clamp(200px,30vw,340px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2vh}
#horse{width:min(27vw,38vh);aspect-ratio:1;padding:0;background:none;transform-origin:85% 92%}
#horse svg{width:100%;height:100%;overflow:visible;display:block}
#horse .headgrp{transform-origin:260px 290px;transform-box:view-box;animation:sway 4s ease-in-out infinite}
#horse .jaw{transform-origin:170px 192px;transform-box:view-box;transition:transform .18s}
#horse .teeth{opacity:0;transition:opacity .15s}
#horse .cheek{transform-origin:152px 168px;transform-box:view-box}
#horse .eye{transform-origin:150px 108px;transform-box:view-box;animation:blink 5s infinite}
#horse .ear{transform-origin:235px 70px;transform-box:view-box;animation:ear 6s infinite}
#horse.open .jaw{transform:rotate(-17deg)}
#horse.open .teeth,#horse.chew .teeth{opacity:1}
#horse.chew .jaw{animation:jaw .36s ease-in-out 5}
#horse.chew .cheek{animation:cheek .36s ease-in-out 5}
#horse.chew .headgrp{animation:bob .36s ease-in-out 5}
#horse.no{animation:headno .8s}
#horse.nudge{animation:hop .5s}
@keyframes sway{50%{transform:rotate(1.8deg)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes ear{0%,90%,100%{transform:rotate(0)}94%{transform:rotate(-12deg)}97%{transform:rotate(4deg)}}
@keyframes jaw{0%,100%{transform:rotate(-2deg)}25%{transform:rotate(-9deg) translateX(3px)}50%{transform:rotate(-16deg)}75%{transform:rotate(-9deg) translateX(-3px)}}
@keyframes cheek{50%{transform:scale(1.14,.9)}}
@keyframes bob{50%{transform:rotate(-2.5deg) translateY(4px)}}
@keyframes headno{0%,100%{transform:rotate(0)}15%{transform:rotate(-16deg) translateX(-12px)}35%{transform:rotate(14deg) translateX(10px)}55%{transform:rotate(-12deg) translateX(-8px)}75%{transform:rotate(8deg) translateX(6px)}}
.hint{font-size:20px;background:var(--cream);border:3px solid var(--tan);border-radius:20px;padding:.2em .8em;text-align:center}
</style>
</head>
<body>
<div class="cloud" style="top:6vh;animation-duration:70s">☁️</div>
<div class="cloud" style="top:14vh;animation-duration:95s;animation-delay:-40s;font-size:6vh">☁️</div>

<div id="turn"><div class="big">📱</div>Turn me sideways! 🐴↻</div>

<!-- HOME -->
<section id="home" class="screen">
  <h1><span class="h">🐴</span> EL's Game Center <span class="h" style="animation-delay:.4s">🌼</span></h1>
  <div id="tiles"></div>
</section>

<!-- GAME SHELL -->
<section id="game" class="screen hidden">
  <div id="topbar">
    <button class="rb" id="back" aria-label="Back to menu">🏠</button>
    <span id="mascot">🐴</span>
    <span id="gtitle"></span>
    <span id="catlabel"></span>
    <button class="rb" id="gear" aria-label="Change words">⚙️</button>
    <span id="lvl"></span>
    <button class="rb" id="snd" aria-label="Sound">🔊</button>
  </div>
  <div id="stage"></div>
</section>

<script>
"use strict";
/* =====================================================================
   WORD BANK DATA  (add categories here; nothing else needs to change)
   ===================================================================== */
const pictureWords = {
  "Animals": [
    {emoji:"🐶",word:"dog",level:1},{emoji:"🐱",word:"cat",level:1},
    {emoji:"🐮",word:"cow",level:1},{emoji:"🐷",word:"pig",level:1},
    {emoji:"🐟",word:"fish",level:1},{emoji:"🐦",word:"bird",level:1},
    {emoji:"🐸",word:"frog",level:1},{emoji:"🐐",word:"goat",level:1},
    {emoji:"🦆",word:"duck",level:2},{emoji:"🐴",word:"horse",level:2},
    {emoji:"🐯",word:"tiger",level:2},{emoji:"🐑",word:"sheep",level:2},
    {emoji:"🐭",word:"mouse",level:2},{emoji:"🐍",word:"snake",level:2},
    {emoji:"🐰",word:"rabbit",level:2},{emoji:"🦛",word:"hippo",level:2},
    {emoji:"🦎",word:"lizard",level:2},{emoji:"🐵",word:"monkey",level:3},
    {emoji:"🐔",word:"chicken",level:3},{emoji:"🐘",word:"elephant",level:3},
    {emoji:"🦒",word:"giraffe",level:3},{emoji:"🐊",word:"crocodile",level:3},
    {emoji:"🕷️",word:"spider",level:3},{emoji:"🐻‍❄️",word:"polar bear",level:3}
  ],
  "Food & Drinks": [
    {emoji:"🥚",word:"egg",level:1},{emoji:"🥛",word:"milk",level:1},
    {emoji:"🍚",word:"rice",level:1},{emoji:"🎂",word:"cake",level:1},
    {emoji:"🫛",word:"pea",level:1},{emoji:"🥩",word:"meat",level:1},
    {emoji:"💧",word:"water",level:1},
    {emoji:"🍎",word:"apple",level:2},{emoji:"🍌",word:"banana",level:2},
    {emoji:"🍞",word:"bread",level:2},{emoji:"🧀",word:"cheese",level:2},
    {emoji:"🍟",word:"chips",level:2},{emoji:"🍇",word:"grape",level:2},
    {emoji:"🧃",word:"juice",level:2},{emoji:"🍋",word:"lemon",level:2},
    {emoji:"🧅",word:"onion",level:2},{emoji:"🍊",word:"orange",level:2},
    {emoji:"🍐",word:"pear",level:2},{emoji:"🍕",word:"pizza",level:2},

const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.random()*a.length|0];

const Bank = {
  pools(){ return {picture:pictureWords, text:textWords}; },
  exists(a){ return !!(a && this.pools()[a.pool] && this.pools()[a.pool][a.cat]); },
  list(picOnly){
    const out=[], P=this.pools();
    for(const pool of Object.keys(P)){ if(picOnly && pool!=="picture") continue;
      for(const cat of Object.keys(P[pool])) out.push({pool,cat}); }
    return out;
  },
  label(a){ return (a.pool==="picture"?"🖼️ ":"📝 ")+a.cat; },
  /* words at or below `level`; if the pool is too small, borrow next-lowest higher words */
  words(a, level, min=1){
    const all = this.pools()[a.pool][a.cat].slice().sort((x,y)=>x.level-y.level);
    let w = all.filter(x=>x.level<=level);
    if(w.length<min) w = all.slice(0,Math.min(min,all.length));
    return w;
  }
};

const Store = {
  KEY:"elMeadowGames.v1",
  d:{assign:{},prog:{}},
  load(){ try{ const r=localStorage.getItem(this.KEY); if(r) this.d=Object.assign({assign:{},prog:{}},JSON.parse(r)); }catch(e){} },
  save(){ try{ localStorage.setItem(this.KEY,JSON.stringify(this.d)); }catch(e){} },
  assignment(gid){
    const m = GAME_META.find(g=>g.id===gid), s = this.d.assign[gid];
    return Bank.exists(s) && (!m.needsPics || s.pool==="picture") ? s : m.def;
  },
  setAssignment(gid,a){ this.d.assign[gid]={pool:a.pool,cat:a.cat}; this.save(); }
};

const Levels = {
  MAX:3, NEED:5,
  key:(gid,a)=>gid+"|"+a.pool+"|"+a.cat,
  get(gid,a){ const k=this.key(gid,a); return Store.d.prog[k] || (Store.d.prog[k]={level:1,streak:0}); },
  /* returns true if this answer unlocked a new level */
  correct(gid,a){
    const p=this.get(gid,a); p.streak++;
    let up=false;
    if(p.streak>=this.NEED){ p.streak=0; if(p.level<this.MAX){ p.level++; up=true; } }
    Store.save(); return up;
  },
  wrong(gid,a){ this.get(gid,a).streak=0; Store.save(); },
  label(gid,a){ const p=this.get(gid,a); return p.level>=this.MAX ? `Level ${p.level} ⭐ ${p.streak}/${this.NEED}` : `Level ${p.level} · ${p.streak}/${this.NEED}`; }
};

const Voice = {
  on:true, voice:null, ctx:null,
  init(){
    if(!("speechSynthesis" in window)) return;
    const choose=()=>{
      const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
      const female=/female|samantha|karen|moira|tessa|victoria|fiona|serena|zira|susan|hazel|kate|allison|ava|joelle|nicky|martha|catherine|sara|helen|linda|emma|amy|joanna|siri|libby|sonia|jenny|aria|natasha|olivia/i;
      const male=/male|daniel|alex|fred|david|mark|james|george|guy|ryan|thomas|arthur|oliver|aaron|gordon|rishi|lee|eddy|reed|ralph|rocko|evan|nathan|liam|brian|matthew|john|richard/i;
      const m=vs.filter(v=>female.test(v.name)&&!/male/i.test(v.name.replace(/female/ig,""))&&!male.test(v.name));
      m.sort((a,b)=>(/en-(US|GB|AU)/i.test(b.lang)?1:0)-(/en-(US|GB|AU)/i.test(a.lang)?1:0));
      this.voice=m[0]||null;   // null -> system default
    };
    choose();
    speechSynthesis.addEventListener ? speechSynthesis.addEventListener("voiceschanged",choose) : (speechSynthesis.onvoiceschanged=choose);
  },
  say(text,rate=0.5){
    if(!this.on||!("speechSynthesis" in window)) return;
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.rate=rate; if(this.voice){u.voice=this.voice;u.lang=this.voice.lang;} else u.lang="en-US";
      speechSynthesis.speak(u);
    }catch(e){}
  },
  /* soft, friendly chimes only — never harsh */
  chime(notes=[660,880],dur=.14){
    if(!this.on) return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
      this.ctx=this.ctx||new AC(); if(this.ctx.state==="suspended") this.ctx.resume();
      notes.forEach((f,i)=>{
        const o=this.ctx.createOscillator(), g=this.ctx.createGain(), t=this.ctx.currentTime+i*dur;
        o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(.12,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+dur+.1);
        o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+dur+.12);
      });
    }catch(e){}
  },
  toggle(){ this.on=!this.on; if(!this.on) try{speechSynthesis.cancel()}catch(e){} return this.on; }
};

const FX = {
  confetti(x,y,n=24,pool=["🎉","⭐","✨","🌟","🌼","💛","🎊"]){
    for(let i=0;i<n;i++){
      const e=document.createElement("div"); e.className="conf"; e.textContent=pick(pool);
      const a=Math.random()*Math.PI*2, r=80+Math.random()*(n>30?320:200);
      e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-60}px;--rot:${(Math.random()*720-360)|0}deg;font-size:${20+Math.random()*24}px`;
      document.body.appendChild(e); setTimeout(()=>e.remove(),1200);
    }
  },
  confettiAt(el,n,pool){ const r=el.getBoundingClientRect(); this.confetti(r.left+r.width/2,r.top+r.height/2,n,pool); },
  banner(text){ const b=document.createElement("div"); b.className="banner"; b.textContent=text; document.body.appendChild(b); setTimeout(()=>b.remove(),1900); },
  hop(){ const m=$("#mascot"); m.classList.remove("hop"); void m.offsetWidth; m.classList.add("hop"); }
};

function makeTimers(){
  const ids=[];
  return { later(fn,ms){ const id=setTimeout(fn,ms); ids.push(id); return id; },
           clear(){ ids.forEach(clearTimeout); ids.length=0; } };
}
function fitText(el,txt,base=5.2){
  const n=txt.length, vw = n<=4?base : n<=7?base*.82 : n<=9?base*.66 : base*.52;
  el.style.fontSize=`min(${vw}vw, ${vw*1.5}vh)`;
}

      const el=document.createElement("div"); el.className="tile"+(live?"":" soon"); el.setAttribute("role","button");

        <div class="nm">${g.name}</div>

        <div class="lv">${Levels.label(g.id,a)}</div>`;
      el.querySelector(".gear").onclick=e=>{ e.stopPropagation(); this.settings(g.id); };
      el.onclick=()=>{ if(live) this.open(g.id); else { FX.banner("Coming soon, EL! 🐴"); } };
      t.appendChild(el);
    });
  },
  home(){
    this.stop(); this.current=null;
    $("#game").classList.add("hidden"); $("#home").classList.remove("hidden");
    this.renderTiles();
  },
  stop(){ if(this.cleanup){ this.cleanup(); this.cleanup=null; } try{speechSynthesis.cancel()}catch(e){} $("#stage").innerHTML=""; },
  open(id){
    this.stop(); this.current=id;
    const m=GAME_META.find(g=>g.id===id);
    $("#home").classList.add("hidden"); $("#game").classList.remove("hidden");
    $("#gtitle").textContent=m.name; $("#snd").textContent=Voice.on?"🔊":"🔇";
    this.hud();
    this.cleanup=Games[id].start($("#stage"));
  },
  hud(){
    if(!this.current) return;
    const a=Store.assignment(this.current);
    $("#catlabel").textContent=Bank.label(a);
    $("#lvl").textContent=Levels.label(this.current,a);
  },
  settings(gid){
    const m=GAME_META.find(g=>g.id===gid), cur=Store.assignment(gid);
    const opts=Bank.list(m.needsPics);
    const wrap=document.createElement("div"); wrap.id="modal";
    wrap.innerHTML=`<div class="box"><h2>${m.icon} ${m.name}</h2>
      <div>Which words should this game use?</div>
      <select>${opts.map(o=>`<option value="${o.pool}|${o.cat}" ${o.pool===cur.pool&&o.cat===cur.cat?"selected":""}>${Bank.label(o)}</option>`).join("")}</select>
      ${m.needsPics?"<small>This game needs pictures, so only picture categories are listed.</small>":""}
      <button class="done">Done ✔</button></div>`;
    document.body.appendChild(wrap);
    wrap.querySelector(".done").onclick=()=>{
      const [pool,...rest]=wrap.querySelector("select").value.split("|"); const cat=rest.join("|");
      wrap.remove();
      if(pool!==cur.pool||cat!==cur.cat){
        Store.setAssignment(gid,{pool,cat});
        if(this.current===gid) this.open(gid); else this.renderTiles();
      }
    };
  }
};

/* =====================================================================
   GAME 1 — WORD CATCH
   ===================================================================== */
Games.catch = { start(stage){
  const gid="catch", T=makeTimers(); let alive=true;
  const JAR_MAX=8, PINATA_TAPS=5;
  let jar=0, target=null, last=null, wrongThisRound=false, locked=false;

  stage.innerHTML=`<div class="catch">
    <div class="jarwrap"><div class="jl">🍬</div><div class="jar"><div class="fill"></div></div><div class="cnt"></div></div>
    <div class="catch-main"><button id="repeat" aria-label="Hear the word again">🔊</button><div id="cards"></div></div>
  </div>`;
  const cards=stage.querySelector("#cards"), fill=stage.querySelector(".fill"), cnt=stage.querySelector(".cnt");
  stage.querySelector("#repeat").onclick=()=>target&&Voice.say(target.word,SLOW);

  function drawJar(){ fill.style.height=(jar/JAR_MAX*100)+"%"; cnt.textContent=`${jar}/${JAR_MAX}`; }

  function round(){
    if(!alive) return;
    wrongThisRound=false; locked=false;
    last=target=dealChoices(gid,cards,T,last,tap);
  }

  function tap(card,w){
    if(locked) return;
    if(w.word!==target.word){
      card.classList.add("wrong");
      if(!wrongThisRound){ wrongThisRound=true; Levels.wrong(gid,Store.assignment(gid)); Hub.hud(); }
      Voice.chime([330,262],.12);
      return;
    }
    locked=true;
    card.classList.add("win");
    [...cards.children].forEach(c=>{ if(c!==card) c.classList.add("gone"); });
    if(wrongThisRound){ Voice.chime([660]); T.later(round,1100); return; }   // second try: no reward
    FX.confettiAt(card,26); FX.hop(); Voice.chime([660,880,1100]);
    Score.right(gid);
    jar=Math.min(JAR_MAX,jar+1); drawJar();
    T.later(()=>{ jar>=JAR_MAX ? pinata() : round(); }, 1100);
  }

  function pinata(){
    let taps=0;
    const o=document.createElement("div"); o.className="pinata";
    o.innerHTML=`<div class="rope"></div><button class="pn">🪅</button><div class="hint">Tap the piñata!</div><div class="pips"></div>`;
    stage.appendChild(o);
    const pn=o.querySelector(".pn"), pips=o.querySelector(".pips");
    const draw=()=>pips.textContent="⭐".repeat(taps)+"☆".repeat(PINATA_TAPS-taps);
    draw();
    pn.onclick=()=>{
      if(taps>=PINATA_TAPS) return;
      taps++; draw(); pn.classList.remove("hit"); void pn.offsetWidth; pn.classList.add("hit");
      Voice.chime([300+taps*80]);
      const r=pn.getBoundingClientRect();
      if(taps<PINATA_TAPS){ FX.confetti(r.left+r.width/2,r.top+r.height/2,8,["🍬","⭐"]); return; }

      T.later(()=>FX.confetti(cx,cy,40),350);

/* =====================================================================
   GAME 2 — MATCH THE COLUMNS
   ===================================================================== */
Games.match = { start(stage){
  const gid="match", T=makeTimers(); let alive=true;
  const PAIRS=4, COLORS=["#ff8a5c","#4aa3ff","#b57bff","#f2b705","#ff6fa5"];
  let tainted=new Set(), items=[], leftCards=[], rightCards=[], selL=null, selR=null, matched=0, locked=false, done=[];

  stage.innerHTML=`<div class="match"><div class="col" id="L"></div><div></div><div class="col" id="R"></div>
    <svg id="lines" xmlns="http://www.w3.org/2000/svg"></svg></div>`;
  const board=stage.querySelector(".match"), L=stage.querySelector("#L"), R=stage.querySelector("#R"), svg=stage.querySelector("#lines");

  function round(){
    if(!alive) return;
    const a=Store.assignment(gid), lv=Levels.get(gid,a).level;
    items=shuffle(Bank.words(a,lv,PAIRS)).slice(0,PAIRS);
    const rightOrder=shuffle(items);
    tainted=new Set(); L.innerHTML=R.innerHTML=svg.innerHTML=""; matched=0; selL=selR=null; locked=false; done=[];
    leftCards=items.map((w,i)=>{
      const c=document.createElement("button"); c.className="mcard word"; c.style.setProperty("--i",i);
      c.textContent=w.word; fitText(c,w.word,4.7); c.onclick=()=>tapL(i); L.appendChild(c); return c; });
    rightCards=rightOrder.map((w,i)=>{
      const c=document.createElement("button"); c.className="mcard pic"; c.style.setProperty("--i",i+.5);
      c.textContent=w.emoji; c.onclick=()=>tapR(i); R.appendChild(c); return c; });
    items.rightOrder=rightOrder;
  }

  const clearSel=()=>{ leftCards.forEach(c=>c.classList.remove("sel")); rightCards.forEach(c=>c.classList.remove("sel")); selL=selR=null; };

  function tapL(i){
    if(locked||leftCards[i].classList.contains("ok")) return;
    if(selL===i){ clearSel(); return; }
    leftCards.forEach(c=>c.classList.remove("sel")); selL=i; leftCards[i].classList.add("sel"); check();
  }
  function tapR(j){
    if(locked||rightCards[j].classList.contains("ok")) return;
    if(selR===j){ rightCards[j].classList.remove("sel"); selR=null; return; }
    Voice.say(items.rightOrder[j].word);
    rightCards.forEach(c=>c.classList.remove("sel")); selR=j; rightCards[j].classList.add("sel"); check();
  }

  function check(){
    if(selL===null||selR===null) return;
    const i=selL, j=selR, ok = items[i].word===items.rightOrder[j].word;
    locked=true;
    if(ok){
      leftCards[i].classList.remove("sel"); rightCards[j].classList.remove("sel");
      leftCards[i].classList.add("ok"); rightCards[j].classList.add("ok");
      done.push({i,j,color:COLORS[matched%COLORS.length]}); drawLines(true);
      FX.confettiAt(rightCards[j],12); FX.hop(); Voice.chime([660,880]);
      matched++; selL=selR=null;
      if(!tainted.has(items[i].word)) Score.right(gid);
      if(matched===PAIRS){
        T.later(()=>{ FX.banner("Great job! 🐴"); FX.confetti(innerWidth/2,innerHeight/2,50); Voice.chime([523,659,784,1047],.15); },500);
        T.later(round,2600);
      } else locked=false;
    } else {
      leftCards[i].classList.add("bad"); rightCards[j].classList.add("bad");
      tainted.add(items[i].word); tainted.add(items.rightOrder[j].word); Score.miss(gid); Voice.chime([330,262],.12);
      T.later(()=>{
        leftCards[i].classList.remove("bad","sel"); rightCards[j].classList.remove("bad","sel");
        selL=selR=null; locked=false; },520);
    }
  }

  /* connecting lines in board pixel space (redrawn on resize) */
  function drawLines(animateLast){
    const b=board.getBoundingClientRect(); svg.innerHTML="";
    done.forEach((d,n)=>{
      const l=leftCards[d.i].getBoundingClientRect(), r=rightCards[d.j].getBoundingClientRect();
      const ln=document.createElementNS("http://www.w3.org/2000/svg","line");
      ln.setAttribute("x1",l.right-b.left); ln.setAttribute("y1",l.top+l.height/2-b.top);
      ln.setAttribute("x2",r.left-b.left);  ln.setAttribute("y2",r.top+r.height/2-b.top);
      ln.setAttribute("stroke",d.color);
      if(!(animateLast&&n===done.length-1)) ln.style.animation="none", ln.style.strokeDashoffset=0;
      svg.appendChild(ln);
    });
  }
  const onResize=()=>drawLines(false);
  addEventListener("resize",onResize);

  round();
  return ()=>{ alive=false; T.clear(); removeEventListener("resize",onResize); };
}};

/* =====================================================================
   SHARED helpers for the listen-and-pick games
   ===================================================================== */
const SLOW=0.5;   // speaking rate for listen-and-pick games
const Score = {   // single place that talks to the level system for games 3-6
  right(gid){ const up=Levels.correct(gid,Store.assignment(gid)); Hub.hud(); if(up) FX.banner("Level up! 🌟"); },
  miss(gid){ Levels.wrong(gid,Store.assignment(gid)); Hub.hud(); }
};
function wordPool(gid,min){ const a=Store.assignment(gid); return {a, pool:Bank.words(a,Levels.get(gid,a).level,min)}; }
/* deal 3 text cards (1 target + 2 distractors), speak the target; used by Word Catch & Horse Race */
function dealChoices(gid,cardsEl,T,prev,onTap){
  const {a,pool}=wordPool(gid,3);
  let t; do{ t=pick(pool); }while(pool.length>1 && prev && t.word===prev.word);
  let others=shuffle(pool.filter(w=>w.word!==t.word)).slice(0,2);
  if(others.length<2){ const all=Bank.pools()[a.pool][a.cat]; others=shuffle(all.filter(w=>w.word!==t.word)).slice(0,2); }
  cardsEl.innerHTML="";
  shuffle([t,...others]).forEach((w,i)=>{
    const c=document.createElement("button"); c.className="wcard"; c.style.setProperty("--i",i);
    c.textContent=w.word; fitText(c,w.word,6.8); c.onclick=()=>onTap(c,w); cardsEl.appendChild(c);
  });
  T.later(()=>Voice.say(t.word,SLOW),550);
  return t;
}

/* =====================================================================
   GAME 3 — HORSE RACE
   ===================================================================== */
Games.race = { start(stage){
  const gid="race", T=makeTimers(); let alive=true;
  const STEPS=8; let step=0, target=null, last=null, wrongThisRound=false, locked=false;
  stage.innerHTML=`<div class="race">
    <div class="track"><div class="finish">🏁</div><div class="runner"><span>🏇</span></div></div>
    <div class="race-row"><button class="rowbtn" id="repeat" aria-label="Hear the word again">🔊</button><div id="cards"></div></div></div>`;
  const cards=stage.querySelector("#cards"), runner=stage.querySelector(".runner"), track=stage.querySelector(".track");
  stage.querySelector("#repeat").onclick=()=>target&&Voice.say(target.word,SLOW);

  function round(){
    if(!alive) return;
    wrongThisRound=false; locked=false;
    last=target=dealChoices(gid,cards,T,last,tap);
  }
  function tap(card,w){
    if(locked) return;
    if(w.word!==target.word){            // horse simply doesn't advance
      card.classList.add("wrong");
      if(!wrongThisRound){ wrongThisRound=true; Score.miss(gid); }
      Voice.chime([330,262],.12); return;
    }
    locked=true; card.classList.add("win");
    [...cards.children].forEach(c=>{ if(c!==card) c.classList.add("gone"); });
    if(wrongThisRound){ Voice.chime([660]); T.later(round,1100); return; }   // second try: horse stays put
    FX.confettiAt(card,18); Voice.chime([660,880,1100]);
    Score.right(gid);
    step++; track.style.setProperty("--p",step/STEPS);
    runner.classList.remove("go"); void runner.offsetWidth; runner.classList.add("go");
    if(step>=STEPS){
      T.later(()=>{ FX.banner("You won the race! 🏆"); FX.confetti(innerWidth/2,innerHeight/2,70); Voice.chime([523,659,784,1047,1319],.15); },1000);
      T.later(()=>{ runner.style.transition="none"; step=0; track.style.setProperty("--p",0); void runner.offsetWidth; runner.style.transition=""; round(); },3600);
    } else T.later(round,1400);
  }
  round();
  return ()=>{ alive=false; T.clear(); };
}};

/* =====================================================================
   GAME 4 — WORD BINGO
   ===================================================================== */
Games.bingo = { start(stage){
  const gid="bingo", T=makeTimers(); let alive=true;
  const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8]];
  let cells=[], calls=[], ci=0, marked=[], wrongThisCall=false, locked=false, btns=[];
  stage.innerHTML=`<div class="bingo"><div class="bside"><button class="rowbtn" id="repeat" aria-label="Hear the word again">🔊</button>
    <button class="chip" id="mode"></button><div class="bcount"></div></div><div class="bgrid"></div></div>`;
  const grid=stage.querySelector(".bgrid"), count=stage.querySelector(".bcount"), modeBtn=stage.querySelector("#mode");
  const mode=()=>Store.d.bingoWin==="full"?"full":"line";
  const drawMode=()=>modeBtn.textContent = mode()==="full" ? "Win: full grid" : "Win: any line";
  modeBtn.onclick=()=>{ Store.d.bingoWin = mode()==="full"?"line":"full"; Store.save(); drawMode(); };
  stage.querySelector("#repeat").onclick=()=>Voice.say(cells[calls[ci]].word,SLOW);
  drawMode();

  function callNext(){ if(!alive) return; wrongThisCall=false; locked=false; Voice.say(cells[calls[ci]].word,SLOW);
    count.textContent=`${Math.min(ci+1,calls.length)}/${calls.length}`; }
  function round(){
    if(!alive) return;
    const {pool}=wordPool(gid,9);
    cells=shuffle(pool).slice(0,9); marked=cells.map(()=>false);
    calls=shuffle(cells.map((_,i)=>i)); ci=0; locked=true;
    grid.innerHTML="";
    btns=cells.map((w,i)=>{ const b=document.createElement("button"); b.className="bcell"; b.style.setProperty("--i",i);
      b.textContent=w.word; fitText(b,w.word,4.7); b.onclick=()=>tap(i); grid.appendChild(b); return b; });
    T.later(callNext,900);
  }
  function won(){
    if(mode()==="full"||cells.length<9) return marked.every(Boolean);
    return LINES.some(l=>l.every(i=>marked[i]));
  }
  function tap(i){
    if(locked||marked[i]) return;
    if(i!==calls[ci]){
      btns[i].classList.add("bad"); T.later(()=>btns[i].classList.remove("bad"),500);
      if(!wrongThisCall){ wrongThisCall=true; Score.miss(gid); } Voice.chime([330,262],.12); return;
    }
    if(wrongThisCall){                       // second try: no star; word is called again later
      locked=true; btns[i].classList.add("again"); T.later(()=>btns[i].classList.remove("again"),800);
      Voice.chime([660]); calls.push(calls[ci]); ci++; T.later(callNext,1100); return;
    }
    locked=true; marked[i]=true; btns[i].classList.add("mark"); FX.confettiAt(btns[i],10); FX.hop(); Voice.chime([660,880]);
    Score.right(gid);
    if(won() || ci+1>=calls.length){
      T.later(()=>{ FX.banner("Bingo! 🎉"); FX.confetti(innerWidth/2,innerHeight/2,70); Voice.chime([523,659,784,1047],.15); },600);
      T.later(round,3200);
    } else { ci++; T.later(callNext,1100); }
  }
  round();
  return ()=>{ alive=false; T.clear(); };
}};

/* =====================================================================
   GAME 5 — WHACK-A-WORD
   ===================================================================== */
Games.whack = { start(stage){
  const gid="whack", T=makeTimers(); let alive=true;
  const HOLES=6, VISIBLE=6000, SPAWN=1800, MAX_UP=3;
  let target=null, last=null, running=false, wrongThisRound=false, sinceTarget=0, stars=0, active=Array(HOLES).fill(null), pool=[];
  stage.innerHTML=`<div class="whack"><div class="bside"><button class="rowbtn" id="repeat" aria-label="Hear the word again">🔊</button>
    <div class="bcount">⭐ 0</div></div><div class="holes"></div>
    <div class="intro"><div class="box"><h2>🔨 Whack-a-Word</h2>
      <p>Listen for the word, then tap it when it pops up!</p>
      <p style="font-size:18px;opacity:.75">Works best as review, once the words are familiar.</p>
      <button class="go">Let's play! 🐴</button></div></div></div>`;
  const holesEl=stage.querySelector(".holes"), cnt=stage.querySelector(".bcount");
  stage.querySelector("#repeat").onclick=()=>target&&Voice.say(target.word,SLOW);
  const wcs=[];
  for(let h=0;h<HOLES;h++){
    const el=document.createElement("div"); el.className="hole";
    el.innerHTML=`<div class="wc"></div><div class="mound"></div>`;
    const wc=el.querySelector(".wc"); wc.onclick=()=>whack(h); wcs.push(wc); holesEl.appendChild(el);
  }
  const hide=h=>{ wcs[h].classList.remove("up"); active[h]=null; };
  const hideAll=()=>{ for(let h=0;h<HOLES;h++){ wcs[h].classList.remove("up","win","soft"); active[h]=null; } };

  function newTarget(){
    if(!alive) return;
    hideAll();
    const wp=wordPool(gid,3); pool=wp.pool;
    do{ target=pick(pool); }while(pool.length>1 && last && target.word===last.word);
    last=target; sinceTarget=0; running=true; wrongThisRound=false;
    T.later(()=>Voice.say(target.word,SLOW),400);
    T.later(spawn,1200);
  }
  function spawn(){
    if(!alive||!running) return;
    const up=active.filter(Boolean).length, free=active.map((v,h)=>v?-1:h).filter(h=>h>=0);
    if(up<MAX_UP && free.length){
      const targetUp=active.some(v=>v&&v.word===target.word);
      let w;
      if(!targetUp && (sinceTarget>=2 || Math.random()<.4)){ w=target; sinceTarget=0; }
      else {
        const shown=active.filter(Boolean).map(v=>v.word);
        let others=pool.filter(x=>x.word!==target.word && !shown.includes(x.word));
        if(!others.length){ const a=Store.assignment(gid), all=Bank.pools()[a.pool][a.cat]; others=all.filter(x=>x.word!==target.word); }
        w=pick(others); sinceTarget++;
      }
      const h=pick(free);
      wcs[h].textContent=w.word; fitText(wcs[h],w.word,4.7); wcs[h].classList.remove("win");
      void wcs[h].offsetWidth; wcs[h].classList.add("up");
      active[h]={word:w.word, id:T.later(()=>hide(h),VISIBLE)};
    }
    T.later(spawn,SPAWN);
  }
  function whack(h){
    const s=active[h]; if(!s||!running) return;
    if(s.word!==target.word){            // forgiving: no penalty, no reward
      if(!wrongThisRound){ wrongThisRound=true; Score.miss(gid); }
      wcs[h].classList.remove("boing"); void wcs[h].offsetWidth; wcs[h].classList.add("boing");
      T.later(()=>hide(h),350); return;
    }
    running=false; T.clear();
    if(wrongThisRound){ wcs[h].classList.add("soft"); Voice.chime([660]); T.later(newTarget,1500); return; }   // second try: no star
    wcs[h].classList.add("win"); FX.confettiAt(wcs[h],24); FX.hop(); Voice.chime([660,880,1100]);
    stars++; cnt.textContent="⭐ "+stars; Score.right(gid);
    T.later(newTarget,1800);
  }
  stage.querySelector(".go").onclick=e=>{ e.target.closest(".intro").remove(); newTarget(); };
  return ()=>{ alive=false; running=false; T.clear(); };
}};
